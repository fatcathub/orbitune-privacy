<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>加入 Orbitune Studio</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--sub:#6c6c70;--acc:#C8462A}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f7;--sub:#a1a1a6;--acc:#FF8C6B}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;padding:48px max(16px,env(safe-area-inset-left)) 32px}
main{max-width:420px;margin:0 auto;display:grid;gap:14px;text-align:center}
h1{font-size:24px;margin:0}
p{margin:0;color:var(--sub);line-height:1.5}
.code{font:700 40px ui-rounded,-apple-system,sans-serif;letter-spacing:4px;color:var(--fg)}
a.btn{display:block;background:var(--acc);color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:14px}
</style></head>
<body><main>
<h1>加入 Orbitune Studio</h1>
<p>點下面的按鈕打開 app，代碼會自動帶入。</p>
<div class="code" id="code">——</div>
<a class="btn" id="open" href="#">用 Orbitune Studio 打開</a>
<p>還沒安裝？先從 TestFlight 安裝，再回來點一次。<br>打不開的話：打開 app › 老師／管理員 › 加入工作空間，輸入上面的代碼。</p>
</main>
<script>
// 只讀網址上的 6 位數字代碼，轉成 app 的連結；不送出任何資料
var c=(new URLSearchParams(location.search).get('code')||'').replace(/\D/g,'').slice(0,6);
document.getElementById('code').textContent=c||'——';
var u='orbitune://join?code='+c;
document.getElementById('open').href=u;
if(c.length===6){setTimeout(function(){location.href=u;},300);}
</script>
</body></html>
